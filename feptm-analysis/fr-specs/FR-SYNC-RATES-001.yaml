id: FR-SYNC-RATES-001
title: Update specialist rates during sync
description: |
  The user changes the specialist rate or client rate of an active specialist
  in Team and runs sync.

  The system updates the rates in current financial reports and recalculates,
  using the new rates, every work entry with an empty Payment Period for the
  specialist whose rate changed. Financial data in closed archived periods
  remains unchanged.

priority: must

acceptance_criteria:
  - "If the specialist rate or client rate of an active specialist changes, sync applies the new value to the current financial reports."
  - "After a rate change, the system recalculates every work entry with an empty Payment Period for the specialist whose rate changed using the new rate."
  - "The value and format of Date do not affect work entry selection for rate recalculation."
  - "Work entries with a non-empty Payment Period and financial data in archived periods are not recalculated after a rate change."
  - "After sync completes, all current project financial reports display the updated calculations."
  - "For an invalid rate, sync preserves the previous rates and calculations, writes an ERROR log in the format \"Invalid rate for specialist '{specialist_name}': {rate_type}='{value}' is not a valid number. Previous rate retained.\", and then continues processing other valid rows."
  - "Running sync again without changing rates does not modify the calculation results."

implements:
  - src/feptm/api/v1/projects.py::sync_project_specialists
  - src/feptm/api/v1/projects.py::sync_project_rates
  - src/feptm/models/specialist.py
  - src/feptm/timesheets/specialist_service.py
  - src/feptm/timesheets/project_service.py
  - src/feptm/timesheets/config_service.py
  - src/feptm/storage/project_storage.py::sync_rates_to_current_period

revision_history:
  - "v1 (2026-08-08, commit TBD): specialist rates are defined in the Specialist model, read from Team, and written to Current Period during /api/projects/sync."
  - "v2 (2026-08-08, WF-1): added the POST /api/projects/sync-rates endpoint to re-read rates from Team and update them independently in financial reports."
  - "v3 (2026-08-08, WF-1 fix): sync_rates_to_current_period updates rates for existing specialists in Current Period while preserving formulas."
  - "v4 (2026-08-08, WF-1): rate sync requires timesheet IDs in Team; the complete sync lifecycle is defined in FR-SYNC-001."
  - "v5 (2026-08-14, commit TBD): recalculation includes every work entry with an empty Payment Period for the specialist whose rate changed and does not use Date for entry selection; for an invalid rate, sync preserves the previous rates and calculations, writes an ERROR log containing the specialist name, rate type, and invalid value, and then continues processing other valid rows."
