id: FR-SYNC-RATES-001
title: Update specialist rates during sync
description: |
  The user updates the existing Internal Rate and External Rate of an active
  specialist in the Team sheet and runs sync.

  The system replaces the specialist's rates in the current financial reports
  and recalculates the entire open period using the latest rate values.
  Financial data for closed archived periods remains unchanged.
priority: must

acceptance_criteria:
  - "If an active specialist's Internal Rate or External Rate changes, sync applies the new value to the current financial reports."
  - "After a rate change, the entire open period is recalculated using the latest rate value."
  - "Rate changes do not affect financial data for closed archived periods."
  - "After a successful sync, all current project financial reports display the updated calculations."
  - "An invalid rate preserves the previous rates and calculations; sync identifies the specialist and the error reason, then continues processing other valid rows."
  - "Running sync again without changing rates does not modify the calculation results."

implements:
  - src/feptm/api/v1/projects.py::sync_project_specialists
  - src/feptm/api/v1/projects.py::sync_project_rates
  - src/feptm/models/specialist.py
  - src/feptm/timesheets/specialist_service.py
  - src/feptm/timesheets/project_service.py
  - src/feptm/timesheets/config_service.py
  - src/feptm/storage/project_storage.py::sync_rates_to_current_period

revision_history:
  - "v1 (2026-08-08, commit TBD): initial FR spec — specialist rates defined in Specialist model, read from Team sheet and written to Current Period sheets during /api/projects/sync."
  - "v2 (2026-08-08, WF-1): added POST /api/projects/sync-rates endpoint — re-reads rates from Team sheet and propagates to report/calculation spreadsheets independently of full sync."
  - "v3 (2026-08-08, WF-1 fix): update_current_period was append-only — existing specialists skipped when re-syncing rates. Added sync_rates_to_current_period method that finds existing row and overwrites rate columns via _write_specialist_fields, preserving column formulas."
