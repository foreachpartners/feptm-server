id: "AR-SECRETS-001"
title: "Secret Protection"
scope: [all]
always_apply: true
context: ""

requirements:
  - "Mask any field carrying a secret (key, token, password, credential) when implementing __repr__, __str__, or any logging path."
  - "Implement __repr__ manually for classes that hold secret fields; do not rely on default."

prohibitions:
  - "Log secrets (encryption keys, API keys, tokens, DB credentials) via logging.debug, print, or any logging path."
  - "Include secrets in error messages or error types."
  - "Hardcode secrets in source — load from env at startup or from a secret store."
  - "Commit backup/scratch files (*.bak, *.backup, *.orig) that may carry pre-redaction content."

templates:
  masked_repr_python: |
    class SensitiveConfig:
        def __repr__(self) -> str:
            return "SensitiveConfig(api_key='***MASKED***')"

checks:
  hardcoded-secrets:
    type: regex
    severity: error
    aspect: security
    description: "Detect potential hardcoded secrets in source"
    files: "src/**/*.py"
    negative:
      - pattern: '(password|secret|token|api_key)\s*[:=]\s*"[^"]{8,}"'
        message: "Potential hardcoded secret"
    exclude_lines:
      - 'example|test|mock|placeholder|fixture'

  no-log-config-debug:
    type: regex
    severity: warn
    aspect: security
    description: "Config must not be logged at debug/info level"
    files: "src/**/*.py"
    exclude_files:
      - "tests/**"
    exclude_lines:
      - 'AR-SECRETS-001:allow'
      - '^\s*#'
    negative:
      - pattern: '(logging|logger)\.(debug|info|warning|error)\(.*config'
        message: "Config logged — may expose secrets. Mask fields or remove log statement"

  no-backup-files:
    type: file_exists
    severity: warn
    aspect: security
    absent:
      - "**/*.bak"
      - "**/*.backup"
      - "**/*.orig"

enforcement: []
