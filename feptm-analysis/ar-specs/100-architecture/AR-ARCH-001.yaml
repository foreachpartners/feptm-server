id: "AR-ARCH-001"
title: "Storage Abstraction Layer (Repository Pattern)"
scope: [service]
always_apply: false
context: ""

requirements:
  - "Business logic services MUST depend on Protocol interfaces, not on the concrete GoogleSheetsService class."
  - "Every storage concern (project data, specialist data, sheet formulas) MUST have a corresponding Protocol defining its public contract."
  - "GoogleSheetsService MUST be injected into storage implementations via their constructors, not imported as a module-level singleton."
  - "Storage class methods MUST expose domain-level operations (e.g., add_specialist, get_metadata) — never expose raw Google Sheets API primitives (spreadsheet_id, range, A1Notation)."
  - "Storage Protocol method signatures MUST use domain types (Project, Specialist, str IDs), not googleapiclient types or raw dicts."
  - "The TimesheetProjectService facade MUST depend on storage Protocols, not on GoogleSheetsService directly."

prohibitions:
  - "Business logic or API handlers calling googleapiclient.discovery.Resource methods (spreadsheets().values().get(), etc.) directly."
  - "Services accessing self.google_sheets_service.sheets_service — bypassing the storage abstraction layer to call raw Google API."
  - "Business logic constructing A1Notation range strings (e.g., 'Sheet1!A1:B20') — ranges must be encapsulated in storage classes."
  - "Business logic constructing Google Sheets formulas (HYPERLINK, IMPORTRANGE, SUMIF) inline — formulas must be generated by storage classes or ConfigStorage."
  - "Business logic calling update_range, batch_update, clear_range directly — these are storage implementation details."
  - "Multiple storage classes implementing the same concern without a shared Protocol — pick one canonical abstraction per concern."

checks:
  no-raw-googleapiclient:
    type: regex
    severity: error
    aspect: architecture
    description: "Business logic must not import googleapiclient or access .sheets_service directly"
    files: "src/feptm/{timesheets,api}/**/*.py"
    exclude_lines:
      - 'AR-ARCH-001:allow'
    negative:
      - pattern: 'googleapiclient'
        message: "Direct import of googleapiclient in business logic — use storage abstraction instead"
      - pattern: '\.sheets_service\.'
        message: "Direct access to .sheets_service bypasses storage abstraction — route through a Repository"

  no-raw-update-calls:
    type: regex
    severity: error
    aspect: architecture
    description: "update_range/batch_update/clear_range must not appear outside storage/ directory"
    files: "src/feptm/{timesheets,api}/**/*.py"
    exclude_lines:
      - 'AR-ARCH-001:allow'
    negative:
      - pattern: 'update_range|batch_update|clear_range|update_sheet_data'
        message: "Raw Google Sheets mutation in business logic — move to storage class"

  no-inline-a1-notation:
    type: regex
    severity: warn
    aspect: architecture
    description: "A1Notation range strings must not be inlined in business logic"
    files: "src/feptm/timesheets/**/*.py"
    exclude_lines:
      - 'AR-ARCH-001:allow'
    negative:
      - pattern: '"[A-Z]+\d+:[A-Z]+\d+"'
        message: "Hardcoded A1Notation range in business logic — use RangeFormat enum or config storage"

  no-inline-formula:
    type: regex
    severity: warn
    aspect: architecture
    description: "Google Sheets formulas must not be inlined in business logic"
    files: "src/feptm/timesheets/**/*.py"
    exclude_lines:
      - 'AR-ARCH-001:allow'
    negative:
      - pattern: '=HYPERLINK\(|=IMPORTRANGE\(|=SUMIF\(|=SUM\('
        message: "Inline Google Sheets formula in business logic — delegate to ConfigStorage or storage class"

  storage-has-protocol:
    type: file_exists
    severity: error
    aspect: architecture
    description: "Every storage module must have a corresponding Protocol"
    required:
      - "src/feptm/storage/project_storage.py"
      - "src/feptm/storage/specialist_storage.py"
      - "src/feptm/storage/config_storage.py"

enforcement: []
