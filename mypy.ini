[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_optional = True
warn_redundant_casts = False
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Allow imports within the package (top priority)
namespace_packages = True
explicit_package_bases = True

# Add src to the Python module search path
mypy_path = $MYPY_CONFIG_FILE_DIR/src

# Import statements
[mypy.plugins.feptm.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_subclassing_any = True
disallow_any_decorated = False
warn_return_any = False
disallow_untyped_decorators = True
no_implicit_reexport = True

# Ignore errors about missing stubs for Google API libraries
[mypy.plugins.google_auth_oauthlib.*]
ignore_missing_imports = True

[mypy.plugins.googleapiclient.*]
ignore_missing_imports = True

# Ignore errors for specific modules (5. Add to ignore list)
[mypy.plugins.googleapiclient.discovery]
ignore_errors = True

[mypy.plugins.googleapiclient.errors]
ignore_errors = True

[mypy.plugins.google_auth_oauthlib.flow]
ignore_errors = True 